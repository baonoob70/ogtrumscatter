<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Bounty Showdown - Custom Images</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: #090503;
            background-image: radial-gradient(circle, #2d1305 0%, #090503 100%);
            color: #fce8ad;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: linear-gradient(180deg, #2b1307 0%, #150903 100%);
            border: 2px solid #d4a340;
            border-radius: 16px;
            padding: 20px;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            text-align: center;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #d4a340;
            margin-bottom: 4px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #523114;
            background: #110803;
            color: #fff;
            outline: none;
        }

        .btn-main {
            width: 100%;
            padding: 10px;
            background: linear-gradient(180deg, #ff9800 0%, #e65100 100%);
            border: 1px solid #ffe082;
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-alt {
            background: transparent;
            border: none;
            color: #d4a340;
            font-size: 12px;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: underline;
        }

        /* GAME STYLES */
        #game-panel { display: none; }
        .user-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .slot-grid {
            display: flex;
            justify-content: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #523114;
            border-radius: 12px;
            padding: 8px 4px;
            margin: 12px 0;
            min-height: 250px;
        }

        .column { display: flex; flex-direction: column; gap: 4px; }
        .symbol {
            width: 52px; height: 52px;
            background: linear-gradient(145deg, #3d200e, #211006);
            border: 1px solid #70431b;
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        .symbol img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #110803;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #3d2310;
            margin-bottom: 12px;
        }

        .spin-btn {
            background: linear-gradient(180deg, #ff9800 0%, #e65100 100%);
            border: 2px solid #ffe082;
            color: #fff;
            width: 60px; height: 60px;
            border-radius: 50%;
            font-weight: 900;
            cursor: pointer;
        }

        /* ADMIN PANEL STYLES */
        #admin-panel { display: none; width: 550px; }
        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 12px;
        }
        .user-table th, .user-table td {
            border: 1px solid #523114;
            padding: 8px;
            text-align: center;
        }
        .user-table th { background: #3d200e; color: #ffd700; }
        .btn-sm {
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. AUTH FORM -->
    <div class="card" id="auth-panel">
        <h2 style="margin-top:0; color:#ffd700;" id="auth-title">ĐĂNG NHẬP GAME</h2>
        <div class="input-group">
            <label>Tên Tài Khoản</label>
            <input type="text" id="auth-username" placeholder="Nhập tên tài khoản...">
        </div>
        <div class="input-group">
            <label>Mật Khẩu</label>
            <input type="password" id="auth-password" placeholder="******">
        </div>
        <button class="btn-main" id="btn-auth-submit">Đăng Nhập</button>
        <button class="btn-alt" id="btn-auth-toggle">Chưa có tài khoản? Đăng ký ngay</button>
    </div>

    <!-- 2. GAME UI -->
    <div class="card" id="game-panel">
        <div class="user-nav">
            <span>Tài khoản: <b id="user-display-name" style="color:#ffd700;">Player</b></span>
            <div>
                <button id="btn-open-admin" style="display:none; background:#d32f2f; color:#fff; border:none; border-radius:4px; padding:4px 8px; cursor:pointer; font-weight:bold;">ADMIN</button>
                <button id="btn-logout" style="background:#424242; color:#fff; border:none; border-radius:4px; padding:4px 8px; cursor:pointer;">Thoát</button>
            </div>
        </div>

        <h1 style="font-size:18px; margin: 0 0 10px 0; color:#ffd700;">Wild Bounty Showdown</h1>

        <div class="slot-grid" id="grid"></div>

        <div class="stats-bar">
            <div>
                <span style="font-size:10px; color:#a3876a; display:block;">SỐ DƯ</span>
                <span id="balance" style="color:#fff; font-weight:bold;">0</span>
            </div>
            <div>
                <span style="font-size:10px; color:#a3876a; display:block;">THẮNG</span>
                <span id="win-amount" style="color:#66bb6a; font-weight:bold;">0</span>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="background:#110803; border:1px solid #3d2310; border-radius:20px; padding:4px 12px;">
                <span style="font-size:12px;">Cược: </span>
                <span id="bet-display" style="font-weight:bold; color:#fff;">10</span>
            </div>
            <button class="spin-btn" id="spin-btn">QUAY</button>
        </div>
    </div>

    <!-- 3. ADMIN PANEL -->
    <div class="card" id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; color:#ffd700;">QUẢN LÝ TÀI KHOẢN</h2>
            <button id="btn-close-admin" style="background:#616161; border:none; color:#fff; border-radius:4px; padding:4px 8px; cursor:pointer;">Game</button>
        </div>
        <hr style="border-color:#523114; margin:15px 0;">

        <table class="user-table">
            <thead>
                <tr>
                    <th>Tài khoản</th>
                    <th>Số dư ($)</th>
                    <th>Chế độ (RTP)</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="admin-user-list"></tbody>
        </table>
    </div>

    <script>
        // Mặc định tài khoản Admin: admin / 123
        let usersDB = JSON.parse(localStorage.getItem('game_users')) || {
            'admin': { password: '123', balance: 999999, rtpMode: 'loose', role: 'admin' }
        };

        let currentUsername = null;
        let isSignUpState = false;
        let currentBet = 10;
        const REEL_CONFIG = [3, 4, 5, 5, 4, 3];

        // KHAI BÁO DANH SÁCH FILE ẢNH SYMBOL TƯƠNG ỨNG
        const SYMBOLS = [
            'cowboy.jpg',
            'wild.jpg',
            'scatter.jpg',
            'gun.jpg',
            'hat.jpg',
            'K.jpg',
            'Q.jpg',
            'J.jpg'
        ];

        function saveDB() {
            localStorage.setItem('game_users', JSON.stringify(usersDB));
        }

        // DOM Elements
        const authPanel = document.getElementById('auth-panel');
        const gamePanel = document.getElementById('game-panel');
        const adminPanel = document.getElementById('admin-panel');
        const authTitle = document.getElementById('auth-title');
        const authUser = document.getElementById('auth-username');
        const authPass = document.getElementById('auth-password');
        const btnAuthSubmit = document.getElementById('btn-auth-submit');
        const btnAuthToggle = document.getElementById('btn-auth-toggle');
        const userDisplayName = document.getElementById('user-display-name');
        const balanceEl = document.getElementById('balance');
        const btnOpenAdmin = document.getElementById('btn-open-admin');

        btnAuthToggle.addEventListener('click', () => {
            isSignUpState = !isSignUpState;
            authTitle.innerText = isSignUpState ? "ĐĂNG KÝ TÀI KHOẢN" : "ĐĂNG NHẬP GAME";
            btnAuthSubmit.innerText = isSignUpState ? "Tạo Tài Khoản" : "Đăng Nhập";
            btnAuthToggle.innerText = isSignUpState ? "Đã có tài khoản? Đăng nhập" : "Chưa có tài khoản? Đăng ký ngay";
        });

        btnAuthSubmit.addEventListener('click', () => {
            const username = authUser.value.trim();
            const password = authPass.value.trim();

            if (!username || !password) return alert("Vui lòng nhập tên tài khoản và mật khẩu!");

            if (isSignUpState) {
                if (usersDB[username]) return alert("Tài khoản này đã tồn tại!");
                usersDB[username] = {
                    password: password,
                    balance: 10000,
                    rtpMode: 'balanced',
                    role: 'user'
                };
                saveDB();
                alert("Đăng ký thành công!");
                btnAuthToggle.click();
            } else {
                if (!usersDB[username] || usersDB[username].password !== password) {
                    return alert("Mật khẩu hoặc tài khoản chưa đúng!");
                }
                loginUser(username);
            }
        });

        function loginUser(username) {
            currentUsername = username;
            authPanel.style.display = 'none';
            gamePanel.style.display = 'block';
            userDisplayName.innerText = username;

            if (usersDB[username].role === 'admin') {
                btnOpenAdmin.style.display = 'inline-block';
            } else {
                btnOpenAdmin.style.display = 'none';
            }

            updateUI();
            renderBoard();
        }

        function updateUI() {
            if (!currentUsername) return;
            balanceEl.innerText = Number(usersDB[currentUsername].balance).toLocaleString();
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            currentUsername = null;
            authPanel.style.display = 'block';
            gamePanel.style.display = 'none';
            adminPanel.style.display = 'none';
            authUser.value = '';
            authPass.value = '';
        });

        // ADMIN CONTROLS
        btnOpenAdmin.addEventListener('click', () => {
            gamePanel.style.display = 'none';
            adminPanel.style.display = 'block';
            renderAdminTable();
        });

        document.getElementById('btn-close-admin').addEventListener('click', () => {
            adminPanel.style.display = 'none';
            gamePanel.style.display = 'block';
        });

        function renderAdminTable() {
            const tbody = document.getElementById('admin-user-list');
            tbody.innerHTML = '';

            for (let uname in usersDB) {
                const u = usersDB[uname];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${uname}</b> ${u.role === 'admin' ? '<span style="color:red">(Admin)</span>' : ''}</td>
                    <td>${Number(u.balance).toLocaleString()}</td>
                    <td>
                        <select onchange="changeRtp('${uname}', this.value)">
                            <option value="loose" ${u.rtpMode === 'loose' ? 'selected' : ''}>Dễ thắng</option>
                            <option value="balanced" ${u.rtpMode === 'balanced' ? 'selected' : ''}>Cân bằng</option>
                            <option value="tight" ${u.rtpMode === 'tight' ? 'selected' : ''}>Khó thắng</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-sm" style="background:#2e7d32; color:#fff;" onclick="adjustMoney('${uname}', 10000)">+10k</button>
                        <button class="btn-sm" style="background:#c62828; color:#fff;" onclick="adjustMoney('${uname}', -10000)">-10k</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        window.adjustMoney = (uname, amount) => {
            usersDB[uname].balance = Math.max(0, usersDB[uname].balance + amount);
            saveDB();
            renderAdminTable();
            updateUI();
        };

        window.changeRtp = (uname, mode) => {
            usersDB[uname].rtpMode = mode;
            saveDB();
        };

        // RENDER SLOT SYMBOLS DÙNG FILE ẢNH .JPG
        function renderBoard() {
            const gridElement = document.getElementById('grid');
            gridElement.innerHTML = '';
            REEL_CONFIG.forEach((rowCount) => {
                const colDiv = document.createElement('div');
                colDiv.className = 'column';
                for (let rowIndex = 0; rowIndex < rowCount; rowIndex++) {
                    const symDiv = document.createElement('div');
                    symDiv.className = 'symbol';
                    
                    // Lấy ngẫu nhiên file ảnh từ mảng SYMBOLS
                    const randomImg = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                    symDiv.innerHTML = `<img src="${randomImg}" alt="Symbol" onerror="this.src='https://via.placeholder.com/52?text=ERR'">`;
                    
                    colDiv.appendChild(symDiv);
                }
                gridElement.appendChild(colDiv);
            });
        }

        document.getElementById('spin-btn').addEventListener('click', () => {
            let u = usersDB[currentUsername];
            if (u.balance < currentBet) return alert("Không đủ tiền cược!");

            u.balance -= currentBet;
            renderBoard(); // Quay đổi hình ảnh ngẫu nhiên

            let winMultiplier = 0;
            const rand = Math.random();

            if (u.rtpMode === 'loose') {
                if (rand < 0.65) winMultiplier = 2.5;
            } else if (u.rtpMode === 'tight') {
                if (rand < 0.15) winMultiplier = 1.2;
            } else {
                if (rand < 0.35) winMultiplier = 2;
            }

            const winAmount = currentBet * winMultiplier;
            u.balance += winAmount;

            saveDB();
            updateUI();

            document.getElementById('win-amount').innerText = winAmount.toLocaleString();
        });
    </script>
</body>
</html>
