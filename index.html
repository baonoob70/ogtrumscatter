<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Bounty Showdown</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #090503;
            background-image: radial-gradient(circle, #2d1305 0%, #090503 100%);
            color: #fce8ad;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background: linear-gradient(180deg, #2b1307 0%, #150903 100%);
            border: 2px solid #d4a340;
            border-radius: 16px;
            padding: 20px;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            text-align: center;
            position: relative;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #d4a340;
            margin-bottom: 4px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #523114;
            background: #110803;
            color: #fff;
            outline: none;
        }

        .btn-main {
            width: 100%;
            padding: 10px;
            background: linear-gradient(180deg, #ff9800 0%, #e65100 100%);
            border: 1px solid #ffe082;
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-alt {
            background: transparent;
            border: none;
            color: #d4a340;
            font-size: 12px;
            cursor: pointer;
            margin-top: 12px;
            text-decoration: underline;
        }

        #game-panel { 
            display: none; 
            width: 380px;
            position: relative;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #game-panel.free-spins-mode {
            border-color: #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6), inset 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .user-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .multiplier-banner {
            background: linear-gradient(90deg, #3a1c09 0%, #6e3a13 50%, #3a1c09 100%);
            border: 1px solid #e0b253;
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
            margin-bottom: 10px;
        }

        .mult-val {
            font-size: 20px;
            font-weight: 900;
            color: #ffeb7b;
            text-shadow: 0 0 8px #ff9800;
        }

        .free-spin-badge {
            background: #d32f2f;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.8);
        }

        .slot-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #523114;
            border-radius: 12px;
            padding: 8px 4px;
            margin: 12px 0;
            min-height: 280px;
            overflow: hidden;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        @keyframes reelSpin {
            0% { transform: translateY(-80px); opacity: 0.4; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .column.spinning {
            animation: reelSpin 0.08s linear infinite;
        }

        @keyframes dropIn {
            0% { transform: translateY(-40px) scale(0.9); opacity: 0; }
            70% { transform: translateY(4px) scale(1.02); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .symbol {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #3d200e, #211006);
            border: 1px solid #70431b;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5);
            transition: transform 0.15s, border-color 0.15s;
            overflow: hidden;
        }

        .symbol img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            pointer-events: none;
        }

        .symbol.dropping {
            animation: dropIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .symbol.gold-frame {
            border: 2px solid #ffd700;
            background: linear-gradient(145deg, #6e4610, #382003);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5), inset 0 0 8px rgba(255, 230, 100, 0.4);
        }

        .symbol.wild {
            background: linear-gradient(145deg, #e65100, #b71c1c);
            border: 2px solid #ffb74d;
            box-shadow: 0 0 12px rgba(255, 152, 0, 0.8);
        }

        .symbol.scatter {
            background: linear-gradient(145deg, #4a148c, #1a237e);
            border: 2px solid #ea80fc;
            box-shadow: 0 0 10px rgba(234, 128, 254, 0.6);
        }

        @keyframes winFlash {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.12); filter: brightness(1.6); box-shadow: 0 0 15px #ffe082; }
            100% { transform: scale(1.05); filter: brightness(1.3); }
        }

        .symbol.win-flash {
            animation: winFlash 0.5s ease-in-out infinite alternate;
            z-index: 5;
            border-color: #fff;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #110803;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #3d2310;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #a3876a;
            font-size: 10px;
            display: block;
        }

        .stat-value {
            color: #fff;
            font-weight: bold;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .bet-control {
            display: flex;
            align-items: center;
            background: #110803;
            border: 1px solid #3d2310;
            border-radius: 20px;
            padding: 2px 6px;
        }

        .bet-btn {
            background: #3d200e;
            color: #ffb74d;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .bet-btn:hover { background: #5c3217; }

        .bet-display {
            width: 50px;
            text-align: center;
            font-weight: bold;
            color: #fff;
            font-size: 13px;
        }

        .spin-btn {
            background: linear-gradient(180deg, #ff9800 0%, #e65100 100%);
            border: 2px solid #ffe082;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(230, 81, 0, 0.6);
            transition: transform 0.1s;
        }

        .buy-scatter-btn {
            background: linear-gradient(180deg, #aa00ff 0%, #4a148c 100%);
            border: 1px solid #ea80fc;
            color: #fff;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            width: 100%;
            box-shadow: 0 2px 8px rgba(170, 0, 255, 0.4);
        }

        .buy-scatter-btn:hover {
            filter: brightness(1.15);
        }

        .spin-btn:active, .buy-scatter-btn:active {
            transform: scale(0.95);
        }

        .spin-btn:disabled, .buy-scatter-btn:disabled {
            background: #424242;
            border-color: #616161;
            box-shadow: none;
            cursor: not-allowed;
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            border-radius: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(180deg, #3d1c06 0%, #1a0a02 100%);
            border: 3px solid #ffd700;
            border-radius: 20px;
            width: 90%;
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 900;
            margin: 0 0 10px 0;
            background: linear-gradient(180deg, #fff3a1 0%, #ff9800 50%, #e65100 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 152, 0, 0.5);
            text-transform: uppercase;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #d4a340;
            margin-bottom: 16px;
        }

        .modal-value {
            font-size: 32px;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.8);
            margin-bottom: 20px;
        }

        .modal-btn {
            background: linear-gradient(180deg, #4caf50 0%, #2e7d32 100%);
            border: 2px solid #a5d6a7;
            color: #fff;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.6);
            transition: transform 0.1s;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        .scatter-modal .modal-card {
            border-color: #ea80fc;
            box-shadow: 0 0 35px rgba(234, 128, 254, 0.5);
            background: linear-gradient(180deg, #3a0d45 0%, #120318 100%);
        }

        .scatter-modal .modal-title {
            background: linear-gradient(180deg, #ffffff 0%, #ea80fc 50%, #aa00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scatter-modal .modal-value {
            color: #ff80ab;
            text-shadow: 0 0 12px rgba(255, 128, 171, 0.8);
        }

        #admin-panel { display: none; width: 720px; }
        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 11px;
        }
        .user-table th, .user-table td {
            border: 1px solid #523114;
            padding: 6px;
            text-align: center;
        }
        .user-table th { background: #3d200e; color: #ffd700; }
        .btn-sm {
            padding: 3px 5px;
            font-size: 9px;
            border-radius: 3px;
            border: none;
            cursor: pointer;
            margin: 1px;
        }
    </style>
</head>
<body>

    <div class="card" id="auth-panel">
        <h2 style="margin-top:0; color:#ffd700;" id="auth-title">ĐĂNG NHẬP GAME</h2>
        <div class="input-group">
            <label>Tên Tài Khoản</label>
            <input type="text" id="auth-username" placeholder="Nhập tên tài khoản...">
        </div>
        <div class="input-group">
            <label>Mật Khẩu</label>
            <input type="password" id="auth-password" placeholder="******">
        </div>
        <button class="btn-main" id="btn-auth-submit">Đăng Nhập</button>
        <button class="btn-alt" id="btn-auth-toggle">Chưa có tài khoản? Đăng ký ngay</button>
    </div>

    <div class="card" id="game-panel">
        <div class="modal-overlay scatter-modal" id="scatter-modal">
            <div class="modal-card">
                <div class="modal-title" id="scatter-title">FREE SPINS!</div>
                <div class="modal-subtitle" id="scatter-desc">Bạn quay trúng 3 SCATTER</div>
                <div class="modal-value" id="scatter-spins-val">+10 VÒNG QUAY</div>
                <button class="modal-btn" id="scatter-confirm-btn">BẮT ĐẦU</button>
            </div>
        </div>

        <div class="modal-overlay" id="bigwin-modal">
            <div class="modal-card">
                <div class="modal-title" id="bigwin-title">BIG WIN!</div>
                <div class="modal-subtitle">TỔNG TIỀN THẮNG</div>
                <div class="modal-value" id="bigwin-val">0</div>
                <button class="modal-btn" id="bigwin-confirm-btn">NHẬN THƯỞNG</button>
            </div>
        </div>

        <div class="user-nav">
            <span>Tài khoản: <b id="user-display-name" style="color:#ffd700;">Player</b></span>
            <div>
                <button id="btn-open-admin" style="display:none; background:#d32f2f; color:#fff; border:none; border-radius:4px; padding:4px 8px; cursor:pointer; font-weight:bold;">ADMIN</button>
                <button id="btn-logout" style="background:#424242; color:#fff; border:none; border-radius:4px; padding:4px 8px; cursor:pointer;">Thoát</button>
            </div>
        </div>

        <h1 style="font-size:18px; margin: 0 0 10px 0; color:#ffd700; text-transform:uppercase;">Wild Bounty Showdown</h1>

        <div class="multiplier-banner">
            <div>
                <span style="font-size:11px; color:#c7a379;">HỆ SỐ THẮNG (MAX X1024)</span>
                <div class="mult-val" id="multiplier">x1</div>
            </div>
            <div class="free-spin-badge" id="free-spin-badge">
                FREE SPINS: <span id="free-spin-count">0</span>
            </div>
        </div>

        <div class="slot-grid" id="grid"></div>

        <button class="buy-scatter-btn" id="buy-scatter-btn">MUA 10 VÒNG SCATTER (<span id="buy-scatter-cost">750</span> điểm)</button>

        <div class="stats-bar">
            <div>
                <span class="stat-label">SỐ DƯ</span>
                <span class="stat-value" id="balance">0</span>
            </div>
            <div>
                <span class="stat-label">THẮNG CƯỢC</span>
                <span class="stat-value" id="win-amount" style="color:#66bb6a;">0</span>
            </div>
        </div>

        <div class="controls">
            <div class="bet-control">
                <button class="bet-btn" id="bet-minus">-</button>
                <span class="bet-display" id="bet-display">10</span>
                <button class="bet-btn" id="bet-plus">+</button>
            </div>
            <button class="spin-btn" id="spin-btn">QUAY</button>
        </div>
    </div>

    <div class="card" id="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; color:#ffd700;">QUẢN LÝ TÀI KHOẢN</h2>
            <button id="btn-close-admin" style="background:#616161; border:none; color:#fff; border-radius:4px; padding:4px 8px; cursor:pointer;">Game</button>
        </div>
        <hr style="border-color:#523114; margin:15px 0;">

        <table class="user-table">
            <thead>
                <tr>
                    <th>Tài khoản</th>
                    <th>Số dư ($)</th>
                    <th>Chế độ (RTP)</th>
                    <th>Cộng / Trừ Điểm</th>
                </tr>
            </thead>
            <tbody id="admin-user-list"></tbody>
        </table>
    </div>

    <script>
        let usersDB = JSON.parse(localStorage.getItem('game_users')) || {
            'admin': { password: '123', balance: 50000, rtpMode: 'balanced', role: 'admin' }
        };

        let deviceRegistered = localStorage.getItem('device_registered') === 'true';
        let currentUsername = null;
        let isSignUpState = false;
        
        const BET_LEVELS = [10, 20, 50, 100, 200, 300, 500, 1000, 2000, 5000, 10000];
        let currentBetIndex = 0;
        let currentBet = BET_LEVELS[currentBetIndex];

        let currentMultiplier = 1;
        let gridData = [];
        let freeSpinsLeft = 0;
        let isFreeSpinsMode = false;

        const REEL_CONFIG = [3, 4, 5, 5, 4, 3];

        const SYMBOL_IMAGES = {
            'WILD': 'wild-bounty-showdown-symbols-10.png',
            'SCATTER': 'wild-bounty-showdown-symbols-9.png',
            'SYM1': 'wild-bounty-showdown-symbols-1.png', 
            'SYM2': 'wild-bounty-showdown-symbols-2.png', 
            'SYM3': 'wild-bounty-showdown-symbols-3.png', 
            'SYM4': 'wild-bounty-showdown-symbols-4.png', 
            'SYM5': 'wild-bounty-showdown-symbols-5.png', 
            'SYM6': 'wild-bounty-showdown-symbols-6.png', 
            'SYM7': 'wild-bounty-showdown-symbols-7.png', 
            'SYM8': 'wild-bounty-showdown-symbols-8.png'  
        };

        const PAYTABLE = {
            'SYM1': [0, 0, 0, 3.0, 6.0, 10.0, 15.0],
            'SYM2': [0, 0, 0, 2.0, 4.0, 7.0,  10.0],
            'SYM3': [0, 0, 0, 1.5, 3.0, 5.0,  8.0],
            'SYM4': [0, 0, 0, 1.0, 2.0, 3.5,  5.0],
            'SYM5': [0, 0, 0, 0.5, 1.0, 1.8,  2.5],
            'SYM6': [0, 0, 0, 0.5, 1.0, 1.8,  2.5],
            'SYM7': [0, 0, 0, 0.2, 0.5, 1.0,  1.5],
            'SYM8': [0, 0, 0, 0.2, 0.5, 1.0,  1.5]
        };

        const SCATTER = 'SCATTER';
        const WILD = 'WILD';
        const SYMBOLS = Object.keys(PAYTABLE);

        function saveDB() {
            localStorage.setItem('game_users', JSON.stringify(usersDB));
        }

        const authPanel = document.getElementById('auth-panel');
        const gamePanel = document.getElementById('game-panel');
        const adminPanel = document.getElementById('admin-panel');
        const authTitle = document.getElementById('auth-title');
        const authUser = document.getElementById('auth-username');
        const authPass = document.getElementById('auth-password');
        const btnAuthSubmit = document.getElementById('btn-auth-submit');
        const btnAuthToggle = document.getElementById('btn-auth-toggle');
        const userDisplayName = document.getElementById('user-display-name');
        const balanceEl = document.getElementById('balance');
        const btnOpenAdmin = document.getElementById('btn-open-admin');

        const gridElement = document.getElementById('grid');
        const spinBtn = document.getElementById('spin-btn');
        const buyScatterBtn = document.getElementById('buy-scatter-btn');
        const buyScatterCostEl = document.getElementById('buy-scatter-cost');
        const multEl = document.getElementById('multiplier');
        const winEl = document.getElementById('win-amount');
        const betDisplay = document.getElementById('bet-display');
        const betMinus = document.getElementById('bet-minus');
        const betPlus = document.getElementById('bet-plus');
        const freeSpinBadge = document.getElementById('free-spin-badge');
        const freeSpinCountEl = document.getElementById('free-spin-count');

        const scatterModal = document.getElementById('scatter-modal');
        const scatterTitle = document.getElementById('scatter-title');
        const scatterDesc = document.getElementById('scatter-desc');
        const scatterSpinsVal = document.getElementById('scatter-spins-val');
        const scatterConfirmBtn = document.getElementById('scatter-confirm-btn');

        const bigwinModal = document.getElementById('bigwin-modal');
        const bigwinTitle = document.getElementById('bigwin-title');
        const bigwinVal = document.getElementById('bigwin-val');
        const bigwinConfirmBtn = document.getElementById('bigwin-confirm-btn');

        function updateBuyScatterCost() {
            const cost = currentBet * 75;
            buyScatterCostEl.innerText = cost.toLocaleString();
        }

        btnAuthToggle.addEventListener('click', () => {
            isSignUpState = !isSignUpState;
            authTitle.innerText = isSignUpState ? "ĐĂNG KÝ TÀI KHOẢN" : "ĐĂNG NHẬP GAME";
            btnAuthSubmit.innerText = isSignUpState ? "Tạo Tài Khoản" : "Đăng Nhập";
            btnAuthToggle.innerText = isSignUpState ? "Đã có tài khoản? Đăng nhập" : "Chưa có tài khoản? Đăng ký ngay";
        });

        btnAuthSubmit.addEventListener('click', () => {
            const username = authUser.value.trim();
            const password = authPass.value.trim();

            if (!username || !password) return;

            if (isSignUpState) {
                if (deviceRegistered) return;
                if (usersDB[username]) return;
                
                usersDB[username] = {
                    password: password,
                    balance: 200,
                    rtpMode: 'balanced',
                    role: 'user'
                };
                saveDB();
                
                localStorage.setItem('device_registered', 'true');
                deviceRegistered = true;
                btnAuthToggle.click();
            } else {
                if (!usersDB[username] || usersDB[username].password !== password) return;
                loginUser(username);
            }
        });

        function loginUser(username) {
            currentUsername = username;
            authPanel.style.display = 'none';
            gamePanel.style.display = 'block';
            userDisplayName.innerText = username;

            if (usersDB[username].role === 'admin') {
                btnOpenAdmin.style.display = 'inline-block';
            } else {
                btnOpenAdmin.style.display = 'none';
            }

            updateUI();
            updateBuyScatterCost();
            createRandomGrid();
            renderBoard(false);
        }

        function updateUI() {
            if (!currentUsername) return;
            balanceEl.innerText = Number(usersDB[currentUsername].balance).toLocaleString();
        }

        document.getElementById('btn-logout').addEventListener('click', () => {
            currentUsername = null;
            authPanel.style.display = 'block';
            gamePanel.style.display = 'none';
            adminPanel.style.display = 'none';
            authUser.value = '';
            authPass.value = '';
        });

        btnOpenAdmin.addEventListener('click', () => {
            gamePanel.style.display = 'none';
            adminPanel.style.display = 'block';
            renderAdminTable();
        });

        document.getElementById('btn-close-admin').addEventListener('click', () => {
            adminPanel.style.display = 'none';
            gamePanel.style.display = 'block';
        });

        function renderAdminTable() {
            const tbody = document.getElementById('admin-user-list');
            tbody.innerHTML = '';

            for (let uname in usersDB) {
                const u = usersDB[uname];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${uname}</b> ${u.role === 'admin' ? '<span style="color:red">(Admin)</span>' : ''}</td>
                    <td>${Number(u.balance).toLocaleString()}</td>
                    <td>
                        <select onchange="changeRtp('${uname}', this.value)">
                            <option value="loose" ${u.rtpMode === 'loose' ? 'selected' : ''}>Dễ thắng</option>
                            <option value="balanced" ${u.rtpMode === 'balanced' ? 'selected' : ''}>Cân bằng</option>
                            <option value="tight" ${u.rtpMode === 'tight' ? 'selected' : ''}>Khó thắng (AI ép thua)</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-sm" style="background:#2e7d32; color:#fff;" onclick="adjustMoney('${uname}', 500)">+500</button>
                        <button class="btn-sm" style="background:#2e7d32; color:#fff;" onclick="adjustMoney('${uname}', 500000)">+500k</button>
                        <button class="btn-sm" style="background:#2e7d32; color:#fff;" onclick="adjustMoney('${uname}', 5000000)">+5M</button>
                        <br>
                        <button class="btn-sm" style="background:#c62828; color:#fff;" onclick="adjustMoney('${uname}', -500)">-500</button>
                        <button class="btn-sm" style="background:#c62828; color:#fff;" onclick="adjustMoney('${uname}', -500000)">-500k</button>
                        <button class="btn-sm" style="background:#c62828; color:#fff;" onclick="adjustMoney('${uname}', -5000000)">-5M</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        window.adjustMoney = (uname, amount) => {
            usersDB[uname].balance = Math.max(0, usersDB[uname].balance + amount);
            saveDB();
            renderAdminTable();
            updateUI();
        };

        window.changeRtp = (uname, mode) => {
            usersDB[uname].rtpMode = mode;
            saveDB();
        };

        function showScatterModal(count, spins, isRetrigger = false) {
            return new Promise(resolve => {
                if (!isRetrigger) {
                    scatterTitle.innerText = "FREE SPINS!";
                    scatterDesc.innerText = `Chúc mừng! Bạn quay trúng ${count} SCATTER`;
                } else {
                    scatterTitle.innerText = "RETRIGGER!";
                    scatterDesc.innerText = `Quay trúng thêm ${count} SCATTER`;
                }
                scatterSpinsVal.innerText = `+${spins} VÒNG QUAY`;
                scatterModal.classList.add('active');

                const handler = () => {
                    scatterModal.classList.remove('active');
                    scatterConfirmBtn.removeEventListener('click', handler);
                    resolve();
                };
                scatterConfirmBtn.addEventListener('click', handler);
            });
        }

        function showBigWinModal(winAmount, betAmount) {
            return new Promise(resolve => {
                const ratio = winAmount / betAmount;
                if (ratio >= 5000) {
                    bigwinTitle.innerText = "MAX WIN!";
                } else if (ratio >= 500) {
                    bigwinTitle.innerText = "MEGA WIN!";
                } else if (ratio >= 50) {
                    bigwinTitle.innerText = "SUPER WIN!";
                } else {
                    bigwinTitle.innerText = "BIG WIN!";
                }

                bigwinVal.innerText = Math.floor(winAmount).toLocaleString();
                bigwinModal.classList.add('active');

                const handler = () => {
                    bigwinModal.classList.remove('active');
                    bigwinConfirmBtn.removeEventListener('click', handler);
                    resolve();
                };
                bigwinConfirmBtn.addEventListener('click', handler);
            });
        }

        function getRandomSymbol(colIndex) {
            let user = usersDB[currentUsername];
            let rtp = user ? user.rtpMode : 'balanced';

            let scatterChance = 0.003; 
            if (rtp === 'tight') scatterChance = 0.001;
            if (rtp === 'loose') scatterChance = 0.006;

            const rand = Math.random();
            if (rand < scatterChance) return SCATTER;

            let weights = {
                'SYM1': 10, 'SYM2': 11, 'SYM3': 12, 'SYM4': 13,
                'SYM5': 14, 'SYM6': 14, 'SYM7': 13, 'SYM8': 13
            };

            let candidateSymbols = Object.keys(weights);
            let totalWeight = candidateSymbols.reduce((sum, sym) => sum + weights[sym], 0);
            let randomWeight = Math.random() * totalWeight;

            for (let sym of candidateSymbols) {
                if (randomWeight < weights[sym]) {
                    return sym;
                }
                randomWeight -= weights[sym];
            }

            return 'SYM8';
        }

        function generateCellData(colIndex, rowIndex, rowCount) {
            const symbol = getRandomSymbol(colIndex);
            const canHaveGoldFrame = (colIndex >= 2 && colIndex <= 4);
            let user = usersDB[currentUsername];
            let goldChance = (user && user.rtpMode === 'tight') ? 0.01 : 0.03; 
            const isGold = (canHaveGoldFrame && symbol !== SCATTER && Math.random() < goldChance); 
            
            return { symbol, isGold, isWild: false, isNew: false };
        }

        function renderBoard(animateDrop = false) {
            gridElement.innerHTML = '';
            REEL_CONFIG.forEach((rowCount, colIndex) => {
                const colDiv = document.createElement('div');
                colDiv.className = 'column';

                for (let rowIndex = 0; rowIndex < rowCount; rowIndex++) {
                    const cell = gridData[colIndex][rowIndex];
                    const symDiv = document.createElement('div');
                    
                    let classList = ['symbol'];
                    if (cell.symbol === SCATTER) classList.push('scatter');
                    if (cell.isWild) classList.push('wild');
                    if (cell.isGold && !cell.isWild) classList.push('gold-frame');
                    if (animateDrop && cell.isNew) classList.push('dropping');

                    symDiv.className = classList.join(' ');
                    
                    const symKey = cell.isWild ? WILD : cell.symbol;
                    const imgSrc = SYMBOL_IMAGES[symKey] || '';
                    symDiv.innerHTML = `<img src="${imgSrc}" alt="${symKey}">`;

                    symDiv.id = `sym-${colIndex}-${rowIndex}`;
                    colDiv.appendChild(symDiv);
                }
                gridElement.appendChild(colDiv);
            });
        }

        function createRandomGrid() {
            gridData = [];
            REEL_CONFIG.forEach((rowCount, colIndex) => {
                let col = [];
                for (let rowIndex = 0; rowIndex < rowCount; rowIndex++) {
                    let cell = generateCellData(colIndex, rowIndex, rowCount);
                    col.push(cell);
                }
                gridData.push(col);
            });
        }

        async function animateSpin() {
            const columns = document.querySelectorAll('.column');
            columns.forEach(col => col.classList.add('spinning'));

            const spinInterval = setInterval(() => {
                createRandomGrid();
                renderBoard(false);
                document.querySelectorAll('.column').forEach(col => col.classList.add('spinning'));
            }, 70);

            for (let i = 0; i < columns.length; i++) {
                await new Promise(r => setTimeout(r, 100));
            }

            clearInterval(spinInterval);
            createRandomGrid();
            renderBoard(false);
        }

        function countScatters() {
            let count = 0;
            let positions = [];
            for (let col = 0; col < REEL_CONFIG.length; col++) {
                for (let row = 0; row < gridData[col].length; row++) {
                    if (gridData[col][row].symbol === SCATTER && !gridData[col][row].isWild) {
                        count++;
                        positions.push({ col, row });
                    }
                }
            }
            return { count, positions };
        }

        function checkWins(bet) {
            let winningPositions = [];
            let totalWinAmount = 0;

            SYMBOLS.forEach(targetSym => {
                let matchCols = 0;
                let waysPerCol = [];
                let currentWinningPos = [];

                for (let col = 0; col < REEL_CONFIG.length; col++) {
                    let matchesInCol = [];
                    for (let row = 0; row < gridData[col].length; row++) {
                        const cell = gridData[col][row];
                        if (!cell.isWild && cell.symbol === SCATTER) continue;

                        if (cell.isWild || cell.symbol === targetSym) {
                            matchesInCol.push({ col, row });
                        }
                    }

                    if (matchesInCol.length > 0) {
                        matchCols++;
                        waysPerCol.push(Math.min(matchesInCol.length, 3)); 
                        currentWinningPos.push(...matchesInCol);
                    } else {
                        break;
                    }
                }

                if (matchCols >= 3) {
                    winningPositions.push(...currentWinningPos);
                    let totalWays = waysPerCol.reduce((a, b) => a * b, 1);
                    let basePayout = PAYTABLE[targetSym][matchCols];
                    let win = basePayout * totalWays * (bet / 20);
                    totalWinAmount += win;
                }
            });

            const uniquePositions = [];
            const posMap = new Set();
            winningPositions.forEach(p => {
                const key = `${p.col}-${p.row}`;
                if (!posMap.has(key)) {
                    posMap.add(key);
                    uniquePositions.push(p);
                }
            });

            return { winningPositions: uniquePositions, totalWinAmount };
        }

        function fillCascadingSymbols(winningPositions) {
            const winSet = new Set(winningPositions.map(p => `${p.col}-${p.row}`));

            for (let col = 0; col < REEL_CONFIG.length; col++) {
                let rowCount = REEL_CONFIG[col];
                for (let row = 0; row < rowCount; row++) {
                    if (winSet.has(`${col}-${row}`)) {
                        const cell = gridData[col][row];
                        if (cell.isGold && !cell.isWild) {
                            gridData[col][row] = { symbol: WILD, isGold: false, isWild: true, isNew: true };
                        } else {
                            let newCell = generateCellData(col, row, rowCount);
                            newCell.isNew = true;
                            gridData[col][row] = newCell;
                        }
                    } else {
                        gridData[col][row].isNew = false;
                    }
                }
            }
        }

        async function handleSpinCore(bet) {
            await animateSpin();

            let roundWin = 0;
            let cascading = true;
            const maxWinCap = bet * 5000;

            while (cascading) {
                const { winningPositions, totalWinAmount } = checkWins(bet);

                if (winningPositions.length > 0) {
                    winningPositions.forEach(pos => {
                        const el = document.getElementById(`sym-${pos.col}-${pos.row}`);
                        if (el) el.classList.add('win-flash');
                    });

                    roundWin += totalWinAmount * currentMultiplier;

                    if (roundWin >= maxWinCap) {
                        roundWin = maxWinCap;
                        winEl.innerText = Math.floor(roundWin).toLocaleString();
                        cascading = false;
                        break;
                    }

                    winEl.innerText = Math.floor(roundWin).toLocaleString();

                    await new Promise(r => setTimeout(r, 600));

                    if (currentMultiplier < 1024) {
                        currentMultiplier = Math.min(currentMultiplier * 2, 1024);
                    }
                    multEl.innerText = `x${currentMultiplier}`;

                    fillCascadingSymbols(winningPositions);
                    renderBoard(true);

                    await new Promise(r => setTimeout(r, 400));
                } else {
                    cascading = false;
                }
            }

            if (roundWin >= bet * 20) {
                await showBigWinModal(roundWin, bet);
            }

            const { count: scatterCount, positions: scatterPositions } = countScatters();

            if (scatterCount >= 3) {
                scatterPositions.forEach(pos => {
                    const el = document.getElementById(`sym-${pos.col}-${pos.row}`);
                    if (el) el.classList.add('win-flash');
                });
                await new Promise(r => setTimeout(r, 400));

                let gainedSpins = 10 + (scatterCount - 3) * 2;

                if (!isFreeSpinsMode) {
                    await showScatterModal(scatterCount, gainedSpins, false);
                    isFreeSpinsMode = true;
                    freeSpinsLeft = gainedSpins;
                    freeSpinBadge.style.display = 'block';
                    freeSpinCountEl.innerText = freeSpinsLeft;
                    gamePanel.classList.add('free-spins-mode');
                } else {
                    await showScatterModal(scatterCount, gainedSpins, true);
                    freeSpinsLeft += gainedSpins;
                    freeSpinCountEl.innerText = freeSpinsLeft;
                }
            }

            usersDB[currentUsername].balance += Math.floor(roundWin);
            saveDB();
            updateUI();
        }

        async function processSpin() {
            let u = usersDB[currentUsername];
            if (!isFreeSpinsMode && u.balance < currentBet) return;

            spinBtn.disabled = true;
            buyScatterBtn.disabled = true;
            betMinus.disabled = true;
            betPlus.disabled = true;

            if (!isFreeSpinsMode) {
                u.balance -= currentBet;
                saveDB();
                updateUI();

                currentMultiplier = 1;
                multEl.innerText = `x${currentMultiplier}`;
                winEl.innerText = '0';

                await handleSpinCore(currentBet);
            }

            while (isFreeSpinsMode && freeSpinsLeft > 0) {
                freeSpinsLeft--;
                freeSpinCountEl.innerText = freeSpinsLeft;

                currentMultiplier = 8;
                multEl.innerText = `x${currentMultiplier}`;

                await new Promise(r => setTimeout(r, 400));
                await handleSpinCore(currentBet);
            }

            if (isFreeSpinsMode && freeSpinsLeft === 0) {
                isFreeSpinsMode = false;
                freeSpinBadge.style.display = 'none';
                gamePanel.classList.remove('free-spins-mode');
            }

            spinBtn.disabled = false;
            buyScatterBtn.disabled = false;
            betMinus.disabled = false;
            betPlus.disabled = false;
        }

        buyScatterBtn.addEventListener('click', async () => {
            if (isFreeSpinsMode) return;
            let cost = currentBet * 75;
            let u = usersDB[currentUsername];

            if (u.balance < cost) return;

            u.balance -= cost;
            saveDB();
            updateUI();

            spinBtn.disabled = true;
            buyScatterBtn.disabled = true;
            betMinus.disabled = true;
            betPlus.disabled = true;

            await showScatterModal(3, 10, false);
            isFreeSpinsMode = true;
            freeSpinsLeft = 10;
            freeSpinBadge.style.display = 'block';
            freeSpinCountEl.innerText = freeSpinsLeft;
            gamePanel.classList.add('free-spins-mode');

            while (isFreeSpinsMode && freeSpinsLeft > 0) {
                freeSpinsLeft--;
                freeSpinCountEl.innerText = freeSpinsLeft;

                currentMultiplier = 8;
                multEl.innerText = `x${currentMultiplier}`;

                await new Promise(r => setTimeout(r, 400));
                await handleSpinCore(currentBet);
            }

            if (isFreeSpinsMode && freeSpinsLeft === 0) {
                isFreeSpinsMode = false;
                freeSpinBadge.style.display = 'none';
                gamePanel.classList.remove('free-spins-mode');
            }

            spinBtn.disabled = false;
            buyScatterBtn.disabled = false;
            betMinus.disabled = false;
            betPlus.disabled = false;
        });

        betMinus.addEventListener('click', () => {
            if (currentBetIndex > 0) {
                currentBetIndex--;
                currentBet = BET_LEVELS[currentBetIndex];
                betDisplay.innerText = currentBet.toLocaleString();
                updateBuyScatterCost();
            }
        });

        betPlus.addEventListener('click', () => {
            if (currentBetIndex < BET_LEVELS.length - 1) {
                currentBetIndex++;
                currentBet = BET_LEVELS[currentBetIndex];
                betDisplay.innerText = currentBet.toLocaleString();
                updateBuyScatterCost();
            }
        });

        spinBtn.addEventListener('click', processSpin);
    </script>
</body>
</html>
